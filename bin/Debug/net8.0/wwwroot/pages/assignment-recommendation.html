<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Assignment Recommendation</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; }
        .explanation-item { margin-bottom: 8px; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html">Adjuster Optimizer</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="claims.html">Claims</a></li>
                <li class="nav-item"><a class="nav-link" href="assignments.html">Assignments</a></li>
                <li class="nav-item"><a class="nav-link" href="adjusters.html">Adjusters</a></li>
                <li class="nav-item"><a class="nav-link" href="performance.html">Performance</a></li>
                <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>

                <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="change-password.html">Change Password</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>

            </ul>
        </div>
    </div>
</nav>


<div class="container mt-4">

    <h2>Assignment Recommendation</h2>
    <p class="text-muted">
        Select a claim to view the recommended adjuster and explanation.
    </p>

    <!-- CLAIM SELECTOR -->
    <div class="card p-3 shadow-sm mb-4" id="claimSelectorCard">
        <h4>Select Claim</h4>

        <div class="row">
            <div class="col-md-6">
                <select id="claimSelect" class="form-select">
                    <option value="">-- Select a Claim --</option>
                </select>
            </div>

            <div class="col-md-3">
                <button class="btn btn-primary w-100" onclick="getRecommendation()">
                    Get Recommendation
                </button>
            </div>
        </div>
    </div>

    <!-- RECOMMENDATION RESULT -->
    <div id="resultSection" class="card p-3 shadow-sm mb-4" style="display:none;">
        <h4>Recommended Adjuster</h4>

        <div id="adjusterInfo" class="mt-3"></div>

        <h5 class="mt-4">Explanation</h5>
        <div id="explanation"></div>

        <button class="btn btn-success mt-3" onclick="autoAssign()">
            Auto‑Assign This Adjuster
        </button>

        <div id="assignMessage" class="mt-3"></div>
    </div>

</div>

<script>
const API_BASE = "https://localhost:7143";

// Load claims into dropdown
async function loadClaims() {
    const select = document.getElementById("claimSelect");

    try {
        const res = await fetch(`${API_BASE}/api/claims`, {
            credentials: "include"
        });

        if (!res.ok) {
            select.innerHTML = "<option>Failed to load claims</option>";
            return;
        }

        const claims = await res.json();

        claims.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.claimId;
            opt.textContent = `Claim #${c.claimId} — ${c.claimType} (${c.jurisdiction})`;
            select.appendChild(opt);
        });

    } catch (err) {
        select.innerHTML = "<option>Unable to connect to server</option>";
    }
}

// Read claimId from URL
function getClaimIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("claimId");
}

// Auto-run recommendation if claimId provided
async function autoLoadClaim() {
    const claimId = getClaimIdFromUrl();

    if (claimId) {
        document.getElementById("claimSelectorCard").style.display = "none";
        await getRecommendation(claimId);
    } else {
        loadClaims();
    }
}

// Fetch recommendation
async function getRecommendation(claimIdOverride = null) {
    const claimId = claimIdOverride || document.getElementById("claimSelect").value;

    if (!claimId) return alert("Please select a claim first.");

    try {
        const res = await fetch(`${API_BASE}/api/assignments/recommend/${claimId}`, {
            credentials: "include"
        });

        if (!res.ok) {
            alert("Failed to load recommendation.");
            return;
        }

        const data = await res.json();

        document.getElementById("resultSection").style.display = "block";

        document.getElementById("adjusterInfo").innerHTML = `
            <div class="alert alert-info">
                <strong>${data.adjuster.name}</strong><br>
                Skill: ${data.adjuster.primarySkill}<br>
                Jurisdiction: ${data.adjuster.jurisdiction}<br>
                Performance Score: ${data.adjuster.performanceScore}<br>
                Workload: ${data.adjuster.workload}
            </div>
        `;

        const exp = data.explanation;
        document.getElementById("explanation").innerHTML = `
            <div><strong>Skill Match:</strong> ${exp.skillMatchReason}</div>
            <div><strong>Jurisdiction:</strong> ${exp.jurisdictionReason}</div>
            <div><strong>Workload:</strong> ${exp.workloadReason}</div>
            <div><strong>Performance:</strong> ${exp.performanceReason}</div>
            <div><strong>Final Score:</strong> ${exp.finalScore}</div>
            <hr>
            <div><strong>Summary:</strong> ${exp.summary}</div>
        `;

    } catch (err) {
        alert("Unable to connect to server.");
    }
}

// Auto-assign
async function autoAssign() {
    const claimId = getClaimIdFromUrl() || document.getElementById("claimSelect").value;

    try {
        const res = await fetch(`${API_BASE}/api/assignments/auto-assign/${claimId}`, {
            method: "POST",
            credentials: "include"
        });

        if (!res.ok) {
            document.getElementById("assignMessage").innerHTML =
                "<div class='alert alert-danger'>Failed to auto-assign.</div>";
            return;
        }

        const data = await res.json();

        document.getElementById("assignMessage").innerHTML = `
            <div class="alert alert-success">
                ${data.message}<br>
                Assignment ID: ${data.assignmentId}
            </div>
        `;

        // ⭐ Refresh recommendation after assignment
        await getRecommendation(claimId);

    } catch (err) {
        document.getElementById("assignMessage").innerHTML =
            "<div class='alert alert-danger'>Unable to connect to server.</div>";
    }
}

// Run auto-load on page start
autoLoadClaim();
</script>

</body>
</html>
