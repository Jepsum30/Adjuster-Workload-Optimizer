<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Assignments - Adjuster Workload Optimizer</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 10px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark p-2">
    <a href="dashboard.html" class="btn btn-outline-light">Back to Dashboard</a>
</nav>

<div class="container mt-4">

    <h2>Assignment History</h2>
    <p class="text-muted">
        This page displays all claim-to-adjuster assignments using live API data.
    </p>

    <p id="errorMessage" class="error"></p>

    <div class="card p-3 shadow-sm mt-3">
        <h4 class="mb-3">Recent Assignments</h4>

        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Assignment ID</th>
                    <th>Claim ID</th>
                    <th>Adjuster</th>
                    <th>Date Assigned</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="assignmentTableBody">
                <!-- Filled by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = "https://localhost:7143/api/assignments";

    async function loadAssignments() {
        const tableBody = document.getElementById("assignmentTableBody");
        const errorMessage = document.getElementById("errorMessage");

        try {
            const response = await fetch(API_BASE, {
                credentials: "include"
            });

            if (!response.ok) {
                throw new Error("API returned status " + response.status);
            }

            const assignments = await response.json();
            tableBody.innerHTML = "";

            assignments.forEach(a => {
                const row = document.createElement("tr");

                const adjusterName = a.adjuster
                    ? `${a.adjuster.firstName} ${a.adjuster.lastName}`
                    : "Unknown";

                const dateAssigned = a.assignedDate
                    ? new Date(a.assignedDate).toLocaleDateString()
                    : "N/A";

                row.innerHTML = `
                    <td>${a.assignmentId}</td>
                    <td>${a.claimId}</td>
                    <td>${adjusterName}</td>
                    <td>${dateAssigned}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="viewClaim(${a.claimId})">
                            View Claim
                        </button>

                        <button class="btn btn-info btn-sm" onclick="viewAdjuster(${a.adjusterId})">
                            View Adjuster
                        </button>

                        <button class="btn btn-primary btn-sm" onclick="recommend(${a.claimId})">
                            Re‑run Recommendation
                        </button>

                        <button class="btn btn-warning btn-sm" onclick="reassign(${a.claimId})">
                            Reassign
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);
            });

        } catch (err) {
            errorMessage.textContent = "Failed to load assignments.";
            console.error("Error loading assignments:", err);
        }
    }

    // Navigation actions
    function viewClaim(claimId) {
        window.location.href = `claim-details.html?claimId=${claimId}`;
    }

    function viewAdjuster(adjusterId) {
        window.location.href = `adjuster-details.html?adjusterId=${adjusterId}`;
    }

    function recommend(claimId) {
        window.location.href = `assignment-recommendation.html?claimId=${claimId}`;
    }

    function reassign(claimId) {
        window.location.href = `assignment-recommendation.html?claimId=${claimId}`;
    }

    loadAssignments();
</script>

</body>
</html>
