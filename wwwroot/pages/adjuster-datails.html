<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Adjuster Details - Adjuster Workload Optimizer</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; }
        .label { font-weight: bold; }
        .btn-sm { margin-right: 6px; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark p-2">
    <a href="adjusters.html" class="btn btn-outline-light">Back to Adjusters</a>
</nav>

<div class="container mt-4">

    <h2>Adjuster Details</h2>
    <p class="text-muted">Full profile, assigned claims, and performance history.</p>

    <div id="errorMessage" class="text-danger fw-bold"></div>

    <!-- ADJUSTER INFO -->
    <div class="card p-3 shadow-sm mt-3">
        <h4 class="mb-3">Adjuster Information</h4>

        <div id="adjusterInfo">Loading...</div>

        <div class="mt-3">
            <button class="btn btn-secondary btn-sm" id="viewClaimsBtn">
                View Assigned Claims
            </button>

            <button class="btn btn-warning btn-sm" id="viewPerformanceBtn">
                View Performance History
            </button>
        </div>
    </div>

    <!-- ASSIGNED CLAIMS -->
    <div class="card p-3 shadow-sm mt-4">
        <h4 class="mb-3">Assigned Claims</h4>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Claim ID</th>
                    <th>Type</th>
                    <th>Jurisdiction</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="assignedClaims"></tbody>
        </table>
    </div>

    <!-- PERFORMANCE HISTORY -->
    <div class="card p-3 shadow-sm mt-4">
        <h4 class="mb-3">Performance History</h4>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Record ID</th>
                    <th>Score</th>
                    <th>Notes</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="performanceHistory"></tbody>
        </table>
    </div>

</div>

<script>
    const API_BASE = "https://localhost:7143";

    // Read adjusterId from URL
    function getAdjusterId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("adjusterId");
    }

    const adjusterId = getAdjusterId();

    if (!adjusterId) {
        document.getElementById("errorMessage").textContent =
            "No adjusterId provided in URL.";
    }

    document.getElementById("viewClaimsBtn").onclick = () => {
        window.location.href = `claims.html?adjusterId=${adjusterId}`;
    };

    document.getElementById("viewPerformanceBtn").onclick = () => {
        window.location.href = `performance.html?adjusterId=${adjusterId}`;
    };

    // Load adjuster details
    async function loadAdjuster() {
        try {
            const res = await fetch(`${API_BASE}/api/adjusters/${adjusterId}`, {
                credentials: "include"
            });

            if (!res.ok) {
                document.getElementById("adjusterInfo").innerHTML =
                    "<p class='text-danger'>Failed to load adjuster.</p>";
                return;
            }

            const a = await res.json();

            document.getElementById("adjusterInfo").innerHTML = `
                <p><span class="label">Name:</span> ${a.first_Name} ${a.last_Name}</p>
                <p><span class="label">Specialty:</span> ${a.specialty}</p>
                <p><span class="label">Jurisdiction:</span> ${a.jurisdiction}</p>
                <p><span class="label">Workload:</span> ${a.workload} Active Claims</p>
                <p><span class="label">Performance Score:</span> ${a.performanceScore}</p>
                <p><span class="label">Tenure:</span> ${a.tenureYears} Years</p>
            `;
        } catch (err) {
            document.getElementById("adjusterInfo").innerHTML =
                "<p class='text-danger'>Unable to connect to server.</p>";
        }
    }

    // Load assigned claims
    async function loadAssignedClaims() {
        const tbody = document.getElementById("assignedClaims");

        try {
            const res = await fetch(`${API_BASE}/api/claims`, {
                credentials: "include"
            });

            if (!res.ok) {
                tbody.innerHTML = "<tr><td colspan='5'>Failed to load claims.</td></tr>";
                return;
            }

            const claims = await res.json();
            const filtered = claims.filter(c => c.assignedAdjusterId == adjusterId);

            if (filtered.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>No assigned claims.</td></tr>";
                return;
            }

            tbody.innerHTML = "";

            filtered.forEach(c => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${c.claimId}</td>
                    <td>${c.claimType}</td>
                    <td>${c.jurisdiction}</td>
                    <td>${c.status}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="recommend(${c.claimId})">
                            Recommend
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="viewClaim(${c.claimId})">
                            View
                        </button>
                    </td>
                `;

                tbody.appendChild(row);
            });

        } catch (err) {
            tbody.innerHTML = "<tr><td colspan='5'>Unable to connect to server.</td></tr>";
        }
    }

    // Load performance history
    async function loadPerformanceHistory() {
        const tbody = document.getElementById("performanceHistory");

        try {
            const res = await fetch(`${API_BASE}/api/performancehistory`, {
                credentials: "include"
            });

            if (!res.ok) {
                tbody.innerHTML = "<tr><td colspan='4'>Failed to load performance.</td></tr>";
                return;
            }

            const records = await res.json();
            const filtered = records.filter(r => r.adjusterId == adjusterId);

            if (filtered.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4'>No performance records.</td></tr>";
                return;
            }

            tbody.innerHTML = "";

            filtered.forEach(r => {
                const date = r.dateRecorded
                    ? new Date(r.dateRecorded).toLocaleDateString()
                    : "N/A";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${r.recordId}</td>
                    <td>${r.score}</td>
                    <td>${r.notes ?? "N/A"}</td>
                    <td>${date}</td>
                `;
                tbody.appendChild(row);
            });

        } catch (err) {
            tbody.innerHTML = "<tr><td colspan='4'>Unable to connect to server.</td></tr>";
        }
    }

    function recommend(claimId) {
        window.location.href = `assignment-recommendation.html?claimId=${claimId}`;
    }

    function viewClaim(claimId) {
        window.location.href = `claim-details.html?claimId=${claimId}`;
    }

    loadAdjuster();
    loadAssignedClaims();
    loadPerformanceHistory();
</script>


</body>
</html>
