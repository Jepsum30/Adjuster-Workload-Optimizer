<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Claim Details - Adjuster Workload Optimizer</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; }
        .label { font-weight: bold; }
        .btn-sm { margin-right: 6px; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark p-2">
    <a href="claims.html" class="btn btn-outline-light">Back to Claims</a>
</nav>

<div class="container mt-4">

    <h2>Claim Details</h2>
    <p class="text-muted">Full information about this claim, including assignment history.</p>

    <div id="errorMessage" class="text-danger fw-bold"></div>

    <!-- CLAIM INFO -->
    <div class="card p-3 shadow-sm mt-3">
        <h4 class="mb-3">Claim Information</h4>

        <div id="claimInfo">Loading...</div>

        <div class="mt-3">
            <button class="btn btn-primary btn-sm" id="recommendBtn">
                Run Recommendation
            </button>

            <button class="btn btn-warning btn-sm" id="reassignBtn">
                Reassign Claim
            </button>
        </div>
    </div>

    <!-- ASSIGNMENT HISTORY -->
    <div class="card p-3 shadow-sm mt-4">
        <h4 class="mb-3">Assignment History</h4>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Assignment ID</th>
                    <th>Adjuster</th>
                    <th>Date Assigned</th>
                </tr>
            </thead>
            <tbody id="assignmentHistory"></tbody>
        </table>
    </div>

</div>

<script>
    const API_BASE = "https://localhost:7143";

    // Read claimId from URL
    function getClaimId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("claimId");
    }

    const claimId = getClaimId();

    if (!claimId) {
        document.getElementById("errorMessage").textContent =
            "No claimId provided in URL.";
    }

    document.getElementById("recommendBtn").onclick = () => {
        window.location.href = `assignment-recommendation.html?claimId=${claimId}`;
    };

    document.getElementById("reassignBtn").onclick = () => {
        window.location.href = `assignment-recommendation.html?claimId=${claimId}`;
    };

    // Load claim details
    async function loadClaim() {
        try {
            const res = await fetch(`${API_BASE}/api/claims/${claimId}`, {
                credentials: "include"
            });

            if (!res.ok) {
                document.getElementById("claimInfo").innerHTML =
                    "<p class='text-danger'>Failed to load claim.</p>";
                return;
            }

            const c = await res.json();

            document.getElementById("claimInfo").innerHTML = `
                <p><span class="label">Claim ID:</span> ${c.claimId}</p>
                <p><span class="label">Type:</span> ${c.claimType}</p>
                <p><span class="label">Jurisdiction:</span> ${c.jurisdiction}</p>
                <p><span class="label">Status:</span> ${c.status}</p>
                <p><span class="label">Description:</span> ${c.description ?? "N/A"}</p>
            `;
        } catch (err) {
            document.getElementById("claimInfo").innerHTML =
                "<p class='text-danger'>Unable to connect to server.</p>";
        }
    }

    // Load assignment history for this claim
    async function loadAssignmentHistory() {
        const tbody = document.getElementById("assignmentHistory");

        try {
            const res = await fetch(`${API_BASE}/api/assignments`, {
                credentials: "include"
            });

            if (!res.ok) {
                tbody.innerHTML = "<tr><td colspan='3'>Failed to load history.</td></tr>";
                return;
            }

            const assignments = await res.json();
            const filtered = assignments.filter(a => a.claimId == claimId);

            if (filtered.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>No assignments found.</td></tr>";
                return;
            }

            tbody.innerHTML = "";

            filtered.forEach(a => {
                const adjusterName = a.adjuster
                    ? `${a.adjuster.firstName} ${a.adjuster.lastName}`
                    : "Unknown";

                const dateAssigned = a.assignedDate
                    ? new Date(a.assignedDate).toLocaleDateString()
                    : "N/A";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${a.assignmentId}</td>
                    <td>${adjusterName}</td>
                    <td>${dateAssigned}</td>
                `;
                tbody.appendChild(row);
            });

        } catch (err) {
            tbody.innerHTML = "<tr><td colspan='3'>Unable to connect to server.</td></tr>";
        }
    }

    loadClaim();
    loadAssignmentHistory();
</script>

</body>
</html>
